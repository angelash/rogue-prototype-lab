<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>Crunch Time! 本地逆向目录</title>
<style>
:root{color-scheme:dark;--bg:#111518;--panel:#1b2227;--line:#364149;--text:#e4e9ec;--muted:#a6b3ba;--accent:#93c7af}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.65 system-ui,"Microsoft YaHei",sans-serif}header,main{max-width:1350px;margin:auto;padding:24px 30px}header{border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0}p{margin:8px 0}small,.muted{color:var(--muted)}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,input,select{background:var(--panel);border:1px solid var(--line);border-radius:4px;color:var(--text);padding:9px 14px;font:inherit}button{cursor:pointer}button.active{border-color:var(--accent);color:var(--accent)}a{color:var(--accent)}.toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}input{flex:1;min-width:250px}.stats{display:flex;gap:34px;flex-wrap:wrap;margin-top:18px}.stats strong{display:block;font-size:22px;font-weight:600;color:var(--accent)}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500;background:var(--bg);position:sticky;top:0}details{margin:12px 0;border-top:1px solid var(--line);padding:12px 0}summary{cursor:pointer;color:var(--accent)}.detail{display:grid;grid-template-columns:minmax(220px,1fr) 3fr;gap:20px;padding:14px 0}.detail img{max-width:100%;max-height:450px;object-fit:contain;background:var(--panel)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--panel);padding:14px;border-radius:4px;font:12px/1.6 Consolas,monospace;max-height:550px;overflow:auto}audio{display:block;max-width:100%;margin:12px 0}.warning{border-left:3px solid var(--accent);padding-left:14px}.legend{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0}.legend span{font-variant-numeric:tabular-nums}#result-count{font-variant-numeric:tabular-nums}td:first-child{font-variant-numeric:tabular-nums}.pager{display:flex;gap:12px;margin:20px 0;align-items:center}@media(max-width:700px){header,main{padding:18px}.detail{grid-template-columns:1fr}th,td{padding:8px 5px}.stats{gap:18px}}
</style></head><body>
<header><h1>Crunch Time! · 本地逆向目录</h1><p class="muted">Steam 构建 484621 · Unity 4.5.2f1 · 2026-10-12 全量静态分析</p><div id="stats" class="stats"></div><nav id="tabs"></nav></header>
<main><div class="toolbar"><input id="search" placeholder="搜索编号、名称、代码符号或对象 ID" aria-label="搜索目录"><select id="filter" aria-label="分类筛选"></select><span id="result-count" class="muted"></span></div><div id="content"></div><div id="pager" class="pager"></div><p><small>本页面只读取嵌入的本地索引；媒体、原始对象、完整 C# 和 XML 链接保留在当前 local 目录。解析覆盖不代表实机游玩、听感或原始 Unity 工程重建。<a href="../reports/analysis.md">中文分析报告</a></small></p></main>
<script id="catalog" type="application/json">__CATALOG_JSON__</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('catalog').textContent),types={0:'声音员工',1:'程序员工',2:'设计员工',3:'美术员工',4:'测试员工',6:'持续阻断',7:'员工干预',8:'正面增益',9:'修复',10:'谈判反制',11:'总部干预'},deps={Sound:'声音',Programming:'程序',Design:'设计',Art:'美术',Testing:'测试'};
const tabs=[['cards','卡牌'],['projects','项目'],['assets','资产'],['code','代码'],['scene','场景'],['translations','文本'],['flow','流程与发现']];let tab='cards',page=0;
const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),href=p=>p.split('/').map(encodeURIComponent).join('/'),localPath=p=>p.replace(/^local\//,''),link=(p,label)=>`<a href="${href(localPath(p))}" target="_blank" rel="noopener">${esc(label)}</a>`,json=v=>`<pre>${esc(JSON.stringify(v,null,2))}</pre>`;
const stats=[['95','卡牌定义'],['28','项目定义'],['1,985','Unity 对象'],['663','游戏方法'],['4,443','已解析引用']];$('stats').innerHTML=stats.map(([n,l])=>`<div><strong>${n}</strong><small>${l}</small></div>`).join('');
function setTab(t){tab=t;page=0;$('search').value='';$('tabs').innerHTML=tabs.map(([id,label])=>`<button class="${id===tab?'active':''}" data-tab="${id}">${label}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));let filters=[['','全部']];if(t==='cards')filters.push(...Object.entries(types));if(t==='assets')filters.push(...Object.keys(D.summary?D.assets.reduce((a,x)=>(a[x.type]=1,a),{}):{}).sort().map(x=>[x,x]));if(t==='projects')filters.push(...Object.keys(D.summary.platforms).map(x=>[x,x]));if(t==='translations')filters.push(...Object.keys(D.summary.localizationSources).map(x=>[x,x]));$('filter').innerHTML=filters.map(([v,l])=>`<option value="${esc(v)}">${esc(l)}</option>`).join('');$('filter').hidden=filters.length===1;render()}
function media(files){return files.filter(f=>/\.(png|wav)$/i.test(f.path)).map(f=>{const p=href(localPath(f.path));return f.path.endsWith('.png')?`<img loading="lazy" src="${p}" alt="本地导出的图像">`:`<audio controls preload="none" src="${p}"></audio>`}).join('')}
function table(headers,rows){return `<table><thead><tr>${headers.map(x=>`<th>${esc(x)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function details(title,body){return `<details><summary>${title}</summary>${body}</details>`}
function render(){let q=$('search').value.toLowerCase().trim(),f=$('filter').value;let rows=(D[tab]||[]).filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!f||String(x.Type??x.type??x.platform??x.source)===f));const total=rows.length;rows=rows.slice(page*40,page*40+40);$('result-count').textContent=tab==='flow'?'静态证据':`${total} 条 · 每页 40 条`;let html='';
if(tab==='cards')html=rows.map(c=>details(`${c.ID} · ${esc(c.texts.Name.ENG)} <small> / ${types[c.Type]} · ${c.Turns} 回合</small>`,`<div class="detail"><div>${media(c.spriteExports)}</div><div><p>${esc(c.texts.Description.ENG)}</p><p class="muted">${esc(c.texts.Description.SPA)}</p><p>原始配置与默认值、文本、图像对象：</p>${json(c)}</div></div>`)).join('');
if(tab==='projects')html=rows.map(c=>details(`${c.ID} · ${esc(c.texts.Title.ENG)} <small> / ${esc(c.platform)} · ${c.totalTasks} 项任务</small>`,`<p>${esc(c.texts.SubTitle.ENG)}</p><div class="legend">${Object.entries(c.effectiveTasks).map(([k,v])=>`<span>${deps[k]}：${v}</span>`).join('')}</div><p class="warning">XML Animation=${c.ignoredAnimation}；加载器只读取 Testing，运行时 Testing=2。${c.testingDiffersFromAnimation?'本项目数值与原配置不同。':'本项目数值碰巧相同。'}</p>${json(c)}`)).join('');
if(tab==='assets')html=rows.map(x=>details(`${esc(x.id)} · ${esc(x.name||x.type)} <small> / ${esc(x.type)} · ${x.bytes.toLocaleString()} 字节</small>`,`<div class="detail"><div>${media(x.exportFiles)}</div><div><p>${x.exportFiles.map(f=>link(f.path,f.path.split('/').pop())).join(' · ')}</p><p>${link(`raw-objects/${x.container}/${x.pathID}_${x.type}.bin`,'原始对象')} · ${link(`typetrees/${x.container}/${x.pathID}_${x.type}.json`,'序列化字段')}</p>${json(x)}</div></div>`)).join('');
if(tab==='code')html=rows.map(t=>details(`${esc(t.name)} <small> / ${t.methods.length} 方法 · ${t.fields.length} 字段</small>`,`<p>${t.source?link(t.source,'完整 C#'):''} · ${link('il/Assembly-CSharp.il','完整 IL')} · 元数据 token ${t.token} · 基类 ${esc(t.baseType)}</p>${table(['方法符号','Token','IL 字节','调用数量'],t.methods.map(m=>[esc(m.name),m.token,m.ilLength,m.calls.length]))}${json(t)}`)).join('');
if(tab==='scene')html=rows.map(x=>details(`${esc(x.id)} · ${esc(x.name)} <small> / ${x.components.length} 组件</small>`,json(x))).join('');
if(tab==='translations')html=table(['ID / 来源','English','Español'],rows.map(x=>[esc(x.id)+'<br><small>'+esc(x.source)+'</small>',esc(x.ENG),esc(x.SPA)]));
if(tab==='flow')html=`<h2 style="font-size:20px">一场对局的执行顺序</h2><p>启动 → 标题 → 两页教程 → 抽取两个不同项目 → 双方各发五张牌 → 回合标题 → 自动修复 → 员工工作推进 → 补牌 → 玩家或 AI 出牌 → 阻断计时 → 下一回合 → 完成项目与排行榜</p><p>员工覆盖声音、程序、设计、美术、测试五部门；每方独立 95 张牌，5 个员工槽、5 个阻断槽。胜利条件是所有部门已完成任务达到目标。预算增加：出牌 500，完成任务 1,250。</p><p class="warning">确认的数据差异：28 项目的 Animation 字段全部被忽略，16 项目的有效测试任务量与该字段不同。完整数值见项目页。</p><p>存档：PlayerPrefs 保存设置与前十排行榜；未发现当前对局恢复。游戏程序集未发现在线、Steam API 或联网调用；引擎附带网络类型不代表游戏实现了联网。</p><p>恢复范围：游戏程序集全量 C# / IL，另外五个托管库全量 C#；全部序列化对象原始数据和字段、图片、音频、字体、内置网格、Shader 文本。原作者编辑器工程与 Unity 原生引擎源代码未恢复，运行时体验未验证。</p>${table(['状态 ID','原始常量'],D.summary.states.map(s=>[s.id,esc(s.name)]))}`;
$('content').innerHTML=html;const pages=Math.ceil(total/40);$('pager').innerHTML=tab==='flow'||pages<2?'':`<button id="prev" ${page===0?'disabled':''}>上一页</button><span>${page+1} / ${pages}</span><button id="next" ${page+1>=pages?'disabled':''}>下一页</button>`;if($('prev'))$('prev').onclick=()=>{page--;render();window.scrollTo(0,0)};if($('next'))$('next').onclick=()=>{page++;render();window.scrollTo(0,0)};}
$('search').oninput=()=>{page=0;render()};$('filter').onchange=()=>{page=0;render()};setTab('cards');
</script></body></html>
