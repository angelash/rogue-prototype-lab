<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>代号：新生 · 本地逆向索引</title>
<style>:root{color-scheme:dark;font:16px/1.6 system-ui;background:#111820;color:#d9e3ed}body{max-width:1180px;margin:auto;padding:28px}h1{font-size:30px;margin-bottom:4px}h2{font-size:20px}.muted{color:#93a8ba}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.card,.result{background:#1b2733;border:1px solid #344758;border-radius:10px;padding:14px;margin:10px 0}.num{font-size:27px;color:#7ddbc9}button,select,input{font:inherit;border:1px solid #456078;background:#1a2b3b;color:inherit;border-radius:6px;padding:7px 12px}button{cursor:pointer}button.active{background:#276a63}input{flex:1;min-width:150px}nav,.search{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.6 Consolas,monospace;color:#c8dbe8}a{color:#80ccf1}img{max-width:100%;max-height:500px;object-fit:contain}audio{max-width:100%}.name{font-weight:600;overflow-wrap:anywhere}#status{min-height:26px}details{margin-top:8px}.warn{border-left:4px solid #d2ac65;padding-left:14px}@media(max-width:600px){body{padding:16px}h1{font-size:24px}.cards{grid-template-columns:repeat(2,1fr)}}
</style><h1>代号：新生（测试版）</h1><div class="muted">APK 0.9.0 · Unity 2022.3.62f3c1 · 静态恢复与本地检索</div><p class="warn">已恢复热更新 IL、配置表与全部资源包。AOT 声明、反编译 C# 和原作者源码分别记录；服务端与真实游玩尚未验证。</p><div class="cards" id="cards"></div>
<nav id="nav"><button data-kind="overview" class="active">系统与范围</button><button data-kind="types">类型 / 源码</button><button data-kind="methods">方法</button><button data-kind="calls">调用位置</button><button data-kind="config">配置 / 文本</button><button data-kind="assets">资源对象</button></nav>
<div class="search" id="search" hidden><select id="profile"><option value="release">Release</option><option value="debug">Debug</option></select><select id="tables" hidden></select><input id="q" placeholder="输入类型、方法、文本或资源名"><button id="go">搜索</button></div><div id="status" class="muted"></div><main id="results"></main>
<script>
let state={kind:'overview',summary:null},requestID=0;const $=id=>document.getElementById(id);const el=(tag,text,cls)=>{const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e};
async function request(url){const r=await fetch(url);if(!r.ok)throw Error('读取失败 '+r.status);return r.json()}
function link(text,path){const a=el('a',text);a.href='/files/'+path.split('/').map(encodeURIComponent).join('/');a.target='_blank';return a}
function details(parent,data){const d=el('details');d.append(el('summary','查看完整索引字段'),el('pre',JSON.stringify(data,null,2)));parent.append(d)}
function overview(){const main=$('results');main.replaceChildren();const items=[['启动与资源','Android 启动 Unity；Launcher 管理补丁和 HybridCLR；当前序列化配置选择 ReleaseHotfix。'],['战斗 ECS','EntityMgr 注册 52 个系统；EcsWorld 按列表顺序 Update / LateUpdate，前后处理命令缓冲。射击、散布、后坐力、子弹、Buff 与移动各有系统。'],['匹配与撤离','MatchControl 处理匹配回包；EvacuateControl 根据服务端进入、退出和结算消息更新倒计时与结算界面。'],['物品与成长','背包、战备、武器改装、部门任务、家园建筑、交易和工作台均有控制器、配置与协议。状态更新依赖回包，客户端无法证明服务器最终规则。'],['资产与文本','191,092 个资源对象、1,077 个 TextAsset；208 张配置表的 30,676 条记录均已读。资源数量与实际可玩内容分别判断。'],['完整性边界','38 份镜像包含 6 份业务热更新及 32 份 AOT 补充元数据。AOT 镜像大量方法没有 IL，原生方法地址与 ELF 留存；不把 extern 声明当作方法体。']];for(const [title,text]of items){const r=el('section',undefined,'result');r.append(el('h2',title),el('p',text));main.append(r)}const r=el('section',undefined,'result');r.append(el('h2','实际包内导出预览'),link('纹理抽样联系表','assets/export/contact-sheet.png'));const img=el('img');img.src='/files/assets/export/contact-sheet.png';img.alt='包内纹理的抽样预览';r.append(img);main.append(r);$('status').textContent='所有请求仅访问本机只读索引。'}
async function search(){const generation=++requestID;if(state.kind==='overview'){overview();return}const p=new URLSearchParams({kind:state.kind,q:$('q').value,profile:$('profile').value,tab:$('tables').value});$('status').textContent='检索中…';try{const data=await request('/api/search?'+p);if(generation!==requestID)return;const main=$('results');main.replaceChildren();for(const x of data.rows){const r=el('section',undefined,'result');r.append(el('div',x.name||x.owner||x.id||x.tab,'name'));if(x.owner)r.append(el('div',x.owner,'muted'));if(x.source)r.append(link('打开反编译 C#',x.source));if(x.assembly)r.append(el('div',x.profile+' / '+x.grp+' / '+x.assembly,'muted'));if(state.kind==='config'){if(x.labels?.length)r.append(el('p','语言键对应：'+x.labels.map(l=>l.field+' = '+l.content).join('；')));r.append(el('pre',JSON.stringify(JSON.parse(x.data),null,2)))}if(state.kind==='assets'){r.append(el('div',x.type+' · bundle '+x.bundle+' · '+x.pathid,'muted'),el('div',x.address||x.script));if(x.export){for(const f of x.export.files){r.append(link(f.path.split('/').pop(),f.path),el('br'));if(f.path.endsWith('.png')){const im=el('img');im.loading='lazy';im.src='/files/'+f.path;im.alt=x.name;r.append(im)}if(f.path.endsWith('.wav')||f.path.endsWith('.ogg')){const a=el('audio');a.controls=true;a.preload='none';a.src='/files/'+f.path;r.append(a)}}}}details(r,x);main.append(r)}$('status').textContent='返回 '+data.rows.length+' 条'+(data.truncated?'（达到上限，请细化关键词）':'');}catch(e){if(generation===requestID)$('status').textContent=e.message}}
$('nav').addEventListener('click',e=>{const k=e.target.dataset.kind;if(!k)return;state.kind=k;for(const b of $('nav').children)b.classList.toggle('active',b.dataset.kind===k);$('search').hidden=k==='overview';$('search').style.display=k==='overview'?'none':'flex';$('tables').hidden=k!=='config';$('profile').hidden=!['types','methods','calls'].includes(k);search()});$('go').onclick=search;$('q').onkeydown=e=>{if(e.key==='Enter')search()};$('tables').onchange=search;$('profile').onchange=search;
request('/api/summary').then(d=>{state.summary=d;for(const [label,n]of [['程序集镜像',d.managedImages],['反编译 C# 文件',d.decompiledFiles],['资源对象',d.assetObjectsIndexed],['配置表',d.tables.length]]){const c=el('div',undefined,'card');c.append(el('div',Number(n).toLocaleString(),'num'),el('div',label,'muted'));$('cards').append(c)}for(const t of d.tables){const o=el('option',t.name+' · '+t.rows+' 行');o.value=t.name;$('tables').append(o)}$('tables').value='language';overview()}).catch(e=>$('status').textContent=e.message);
</script></html>
