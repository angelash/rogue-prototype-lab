<main><header><small>本机研究索引 · 2026-10-13 · APK 0.9.0</small><h1>代号：新生（测试版）</h1><p>客户端资源地址、脚本身份和 Android 类结构。可搜索全部已登记条目。</p></header>

<script>
const D=JSON.parse(document.querySelector('#data').textContent),$=s=>document.querySelector(s);
let mode='assets',page=0,found=[];const size=75;
const options={assets:{title:'内容与资源',data:D.assets,keys:['address','path','bundleID','extension'],heads:['地址','原始资源路径','资源包 ID','格式'],filter:'extension',intro:'22,162 个地址全部在 APK 资源清单中登记。点击行查看包文件、依赖与包内存在状态。格式是原始资源路径后缀，不能视为已解码对象类型。'},scripts:{title:'Unity 脚本',data:D.scripts,keys:['assembly','name','source','pathID'],heads:['程序集','完整类型名','来源文件','Path ID'],filter:'assembly',intro:'4,352 条 MonoScript 描述。它们提供脚本身份，不包含完整方法体，不能等同于全部游戏类型。'},dex:{title:'Android 类',data:D.dex,keys:['dex','name','base','methods'],heads:['DEX','类名','父类','定义方法数'],filter:'dex',intro:'28 个 DEX 的 11,505 条类定义；11,482 个唯一类名。重复类名保留来源，不合并成虚假的单一程序集。'},bundles:{title:'资源文件',data:D.bundles,keys:['id','name','bytes','loadMethod'],heads:['ID','资源包名称','文件字节','加载方法'],filter:'loadMethod',intro:'清单中的 1,017 个文件全部存在，逐文件大小吻合；36 个原生文件、981 个自定义封装的资源包。文件存在不等于已解析。'}};
function node(tag,text){const e=document.createElement(tag);e.textContent=String(text??'');return e}
for(const [label,value] of [['包文件',2051],['资源地址',D.assets.length],['Unity 脚本描述',D.scripts.length],['Android 类定义',D.dex.length]]){const d=node('div','');d.append(node('b',value.toLocaleString()),node('small',label));$('#stats').append(d)}
for(const [k,v] of Object.entries(options)){const b=node('button',v.title);b.dataset.mode=k;b.onclick=()=>{mode=k;page=0;$('#search').value='';$('#detail').hidden=true;setup()};$('#nav').append(b)}
function setup(){const o=options[mode];for(const b of $('#nav').children)b.setAttribute('aria-pressed',String(b.dataset.mode===mode));$('#intro').textContent=o.intro;$('#head').replaceChildren();const tr=node('tr','');o.heads.forEach(x=>tr.append(node('th',x)));$('#head').append(tr);$('#filter').replaceChildren(node('option','全部'));$('#filter').firstChild.value='';[...new Set(o.data.map(x=>String(x[o.filter])))].sort().forEach(x=>{const opt=node('option',x);opt.value=x;$('#filter').append(opt)});render()}
function render(){const o=options[mode],q=$('#search').value.trim().toLowerCase(),f=$('#filter').value;found=o.data.filter(x=>(!f||String(x[o.filter])===f)&&(!q||o.keys.some(k=>String(x[k]??'').toLowerCase().includes(q))));page=Math.min(page,Math.max(0,Math.ceil(found.length/size)-1));$('#count').textContent=`匹配 ${found.length.toLocaleString()} / ${o.data.length.toLocaleString()} 条`;$('#rows').replaceChildren();for(const r of found.slice(page*size,(page+1)*size)){const tr=node('tr','');o.keys.forEach(k=>tr.append(node('td',r[k])));tr.tabIndex=0;tr.setAttribute('role','button');tr.onclick=()=>show(r);tr.onkeydown=e=>{if(e.key==='Enter')show(r)};$('#rows').append(tr)}$('#page').textContent=`第 ${page+1} / ${Math.max(1,Math.ceil(found.length/size))} 页`;$('#prev').disabled=!page;$('#next').disabled=(page+1)*size>=found.length}
function show(r){let detail={...r};if(mode==='assets'){const b=D.bundles[r.bundleID];detail.bundle={filename:b.filename,bytes:b.bytes,inAPK:b.inAPK,loadMethod:b.loadMethod};detail.dependencyFiles=r.dependencies.map(i=>D.bundles[i].filename)}$('#detail').textContent=JSON.stringify(detail,null,2);$('#detail').hidden=false}
$('#search').oninput=()=>{page=0;render()};$('#filter').onchange=()=>{page=0;render()};$('#prev').onclick=()=>{page--;render()};$('#next').onclick=()=>{page++;render()};setup();
</script></html>
