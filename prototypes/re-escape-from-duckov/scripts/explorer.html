<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Duckov · 静态研究目录</title>
<style>
:root{--bg:#f5f4ef;--fg:#26312a;--line:#d9ddd4;--accent:#365a40;--muted:#727a6f;--surface:#fffef9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Microsoft YaHei",system-ui}header{padding:24px 30px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 16px}p{margin:6px 0;color:var(--muted)}.label{font-size:11px;letter-spacing:2px;color:var(--accent)}.shell{display:grid;grid-template-columns:200px minmax(340px,1fr) minmax(360px,1.15fr);min-height:calc(100vh - 112px)}nav{padding:16px 12px;border-right:1px solid var(--line)}button{cursor:pointer;font:inherit;background:none;color:inherit;border:1px solid var(--line);border-radius:4px;padding:6px 11px}nav button{display:block;width:100%;text-align:left;border:0;padding:7px 12px}nav button.active{background:var(--accent);color:white}nav small{display:block;color:var(--muted);padding:10px 12px 2px}main{padding:22px;border-right:1px solid var(--line)}aside{padding:22px;background:var(--surface);overflow-wrap:anywhere}.toolbar{display:flex;gap:8px;margin-bottom:12px}input{width:100%;font:inherit;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:9px 12px}.row{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:11px 4px;display:block}.row:hover{background:var(--surface)}.row b{font-weight:500}.meta{font-size:12px;color:var(--muted);display:block}.pager{display:flex;justify-content:space-between;align-items:center;margin-top:15px}pre{font:12px/1.55 Consolas,monospace;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);padding:14px;max-height:62vh;overflow:auto}.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:24px;margin:24px 0}.fact strong{display:block;font-size:22px;font-weight:500;color:var(--accent)}.block{margin:25px 0}.notice{border-left:3px solid var(--accent);padding-left:12px}.preview{max-width:100%;max-height:250px;object-fit:contain;margin:16px 0}a{color:var(--accent)}details{margin:12px 0}summary{cursor:pointer;color:var(--accent)}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chip{font-size:12px;padding:3px 7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:1000px){.shell{grid-template-columns:170px 1fr}aside{grid-column:2}main{border-bottom:1px solid var(--line)}}
</style>
<header><div><div class="label">LOCAL BUILD RESEARCH / 2026-10-13</div><h1>Escape from Duckov</h1><p>2.3.30 · Unity 2022.3.62f2 · Mono · 本地静态证据</p></div><div>代码 → 配置 → 对象 → 资源</div></header>
<div class="shell"><nav id="nav"></nav><main id="main"></main><aside id="detail"><h2>从内容追到实现</h2><p>选择条目可查看完整配置，点击对象编号查看资产引用与导出预览。</p><p class="notice">目录记录当前安装构建的静态内容；配置存在不代表已验证可达或实际玩法表现。</p></aside></div>
<script>
const labels={overview:'分析总览',items:'物品',quests:'任务与奖励',recipes:'制作配方',buildings:'基地建筑',merchants:'商店货表',enemyPresets:'角色预设',bossPresets:'Boss 标记预设',buffs:'状态与 Buff',perkTrees:'天赋树',perks:'天赋节点',crops:'作物',scenes:'构建场景',sceneInfos:'场景登记',levelConfigs:'关卡配置',rules:'规则集',graphs:'关系图与行为树',families:'全部脚本对象族',code:'全部代码类型',objects:'全部资产对象',audio:'音频事件',samples:'音频样本',gameplay:'总玩法配置',lootLoaders:'容器掉落配置',lootSpawners:'物品生成配置'};
const groups=[['研究入口',['overview','code','objects','gameplay','families']],['玩法与内容',['items','quests','recipes','buildings','merchants','enemyPresets','bossPresets','buffs','perkTrees','perks','crops']],['场景与规则',['scenes','sceneInfos','levelConfigs','rules','graphs','lootLoaders','lootSpawners']],['声音',['audio','samples']]];
let category='overview',page=0,query='',overview,rows=[],filters={};const $=id=>document.getElementById(id);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,args={}){const r=await fetch('/api/'+path+'?'+new URLSearchParams(args));const data=await r.json();if(!r.ok)throw Error(data.error);return data}
function nav(){ $('nav').innerHTML=groups.map(([name,cats])=>'<small>'+name+'</small>'+cats.map(c=>`<button data-category="${c}" class="${c===category?'active':''}">${labels[c]}</button>`).join('')).join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>select(b.dataset.category)) }
async function select(c){category=c;page=0;query='';filters={};nav();await render()}
async function render(){
 if(category==='overview'){const a=overview['asset-summary'],c=overview['content-summary'].categories;$('main').innerHTML=`<h2>全量索引已经建立</h2><p>来源：本机 Steam 安装副本；原件与副本逐文件 SHA256 一致。</p><div class="facts">${[['安装文件',466],['Unity 对象',a.objects],['程序集',201],['物品登记',c.items],['任务登记',c.quests],['制作配方',c.recipes]].map(([k,v])=>`<div class="fact"><span>${k}</span><strong>${v.toLocaleString()}</strong></div>`).join('')}</div><div class="block"><h2>系统结构</h2><p>Startup → GameManager → SceneLoader / LevelManager</p><p>Character / Combat / AI ↔ ItemStats / Inventory</p><p>Quests / Buildings / Crafting / Economy → SavesSystem</p><p>GameplayDataSettings → 配置库 → 场景与媒体</p></div><div class="block"><h2>覆盖与实际限制</h2><p>131 个容器 · 97,426 个脚本对象的脚本引用独立复核 · ${a.unresolvedEdges} 条索引悬空引用</p><p>2 个对象仅恢复基础字段；7 个 Shader 保留原始编译载荷；NodeCanvas 一个类型的 C# 转换失败，完整 IL 已保留。</p><p>FMOD：373 个事件 / 568 个解码样本。游戏窗口游玩、主观听感、作者工程重建未执行。</p></div>`;return}
 const result=await api('list',{category,q:query,page,...filters});rows=result.rows;
 $('main').innerHTML=`<h2>${labels[category]}</h2><div class="toolbar"><input id="search" placeholder="搜索名称、ID、符号或配置值" value="${esc(query)}"><button id="searchButton">查找</button></div><p>${result.total.toLocaleString()} 条 · 每页 50 条${filters.script?' · '+esc(filters.script):''}${filters.container?' · '+esc(filters.container):''}</p><div id="list">${rows.map((r,i)=>`<button class="row" data-row="${i}"><b>${esc(r.name||r.path||r.id||r.objectID)}</b><span class="meta">${esc(r.id??r.objectID??r.assembly??'')} ${esc(r.type||r.script||'')} ${r.count?' · '+r.count+' 个':''}</span></button>`).join('')}</div><div class="pager"><button id="prev" ${page===0?'disabled':''}>上一页</button><span>${page+1} / ${Math.max(1,Math.ceil(result.total/50))}</span><button id="next" ${(page+1)*50>=result.total?'disabled':''}>下一页</button></div>`;
 $('searchButton').onclick=()=>{query=$('search').value;page=0;render()};$('search').onkeydown=e=>{if(e.key==='Enter')$('searchButton').click()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('list').querySelectorAll('button').forEach(b=>b.onclick=()=>detail(rows[Number(b.dataset.row)]))
}
async function objectDetail(id){const r=await api('detail',{category:'objects',id});show(r,'objects');}
async function detail(row){if(category==='families'){category='objects';filters={script:row.id,type:'MonoBehaviour'};page=0;query='';nav();return render()}if(category==='scenes'){category='objects';filters={container:row.objectContainer};page=0;query='';nav();return render()}const id=category==='code'?row.name:row.key??row.id??row.objectID??row.path??row.name;const r=await api('detail',{category,id,assembly:row.assembly||''});show(r,category)}
function show(r,cat){if(!r)return;const files=r.exportFiles||[];let title=r.name||r.assetName||r.path||r.id||r.objectID||labels[cat];let objectIDs=new Set();if(r.objectID)objectIDs.add(r.objectID);if(r.iconObject)objectIDs.add(r.iconObject);(r.components||[]).forEach(x=>objectIDs.add(x.objectID));
 let html=`<h2>${esc(title)}</h2>${r.description?'<p>'+esc(r.description)+'</p>':''}<div class="chips">${[...objectIDs].map(id=>`<button class="chip" data-object="${esc(id)}">${esc(id)}</button>`).join('')}</div>`;
 files.filter(f=>/\.png$/i.test(f.path)).slice(0,3).forEach(f=>html+=`<img class="preview" src="/media/${encodeURI(f.path)}" alt="${esc(title)}">`);
 if(cat==='samples')html+=`<audio controls src="/media/${encodeURI(r.path)}"></audio>`;
 if(r.references)html+=`<details><summary>引用 ${r.references.length} 条</summary>${r.references.map(e=>`<button class="row" data-object="${esc(e.dst)}">${esc(e.field)}<span class="meta">${esc(e.dst)}</span></button>`).join('')}</details>`;
 if(r.usedBy)html+=`<details><summary>被引用（最多显示 80 条）</summary>${r.usedBy.map(e=>`<button class="row" data-object="${esc(e.src)}">${esc(e.src)}<span class="meta">${esc(e.field)}</span></button>`).join('')}</details>`;
 if(r.graph&&Array.isArray(r.graph.nodes))html+=`<p>${r.graph.nodes.length} 个节点 · ${(r.graph.connections||[]).length} 条连接</p>`;
 if(cat==='code')html+=`<p>${(r.methods||[]).length} 个方法 · ${(r.fields||[]).length} 个字段 · token ${esc(r.token)}</p><p>${(r.sourceFiles||[]).map(f=>`<a href="/source/${encodeURI(f)}" target="_blank">反编译 C#</a>`).join(' · ')} ${(r.ilFiles||[]).map(f=>`<a href="/source/${encodeURI(f)}" target="_blank">完整程序集 IL</a>`).join(' · ')}</p>`;
 const payload=JSON.stringify(r,null,2);html+=`<details ${payload.length<24000?'open':''}><summary>${cat==='code'?'方法、IL 调用与字段':'完整配置与证据'}${payload.length>=24000?'（点击展开）':''}</summary><pre>${esc(payload)}</pre></details>`;$('detail').innerHTML=html;$('detail').querySelectorAll('[data-object]').forEach(b=>b.onclick=()=>objectDetail(b.dataset.object))
}
api('overview').then(r=>{overview=r;nav();render()}).catch(e=>{$('main').textContent=e.message});
</script></html>
