<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小小神兵 · 本地研究目录</title>
<style>html{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui;background:#17191c;color:#e4e7eb}header{padding:24px 30px;border-bottom:1px solid #383c43}h1{font-size:24px;margin:0}p{margin:8px 0;color:#aeb6c1}nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}button,input,select{font:inherit;background:#252a31;color:inherit;border:1px solid #4a515c;border-radius:5px;padding:7px 12px}button{cursor:pointer}button.active{background:#254973;border-color:#71a7dd}main{padding:22px 30px;display:grid;grid-template-columns:minmax(260px,40%) minmax(0,1fr);gap:24px}.toolbar{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px}input{min-width:160px;flex:1}#items{min-width:0}article{padding:12px 0;border-bottom:1px solid #383c43;cursor:pointer;overflow-wrap:anywhere}article:hover{background:#252a31}small{color:#a4afbd}#detail{min-width:0;position:sticky;top:12px;max-height:80vh;overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.65 Consolas,monospace;margin:0;padding:14px;background:#20242a}img{max-width:100%;height:auto;background:#30353c}audio{width:100%}a{color:#8dbbf0}footer{padding:0 30px 24px;color:#a4afbd;font-size:12px}@media(max-width:760px){header,main{padding:18px}main{grid-template-columns:1fr}#detail{position:static;max-height:none}}</style>
<header><h1>小小神兵 · 本地研究目录</h1><p>0.1.3 · Android / Unity 2022.3.62f3 · 全量原字节、恢复代码、配置与资产各有独立覆盖记录</p><p>本页只读、绑定本机。C# / Java 是阅读用反编译结果；AOT 补充 IL、原生机器码、原作者工程与实际游玩分开。</p><nav id="nav"></nav></header>
<main><div class="toolbar"><input id="query" aria-label="搜索" placeholder="名称、类型、源码文本或中文配置"><select id="kind" aria-label="资产类型"><option value="">全部资产类型</option><option>Texture2D</option><option>Sprite</option><option>Mesh</option><option>AudioClip</option><option>MonoBehaviour</option><option>TextAsset</option><option>GameObject</option></select><button id="search">搜索</button><button id="prev">上一页</button><button id="next">下一页</button><span id="page"></span></div><section id="items"></section><section id="detail"></section></main>
<footer>入口中的 path ID 使用十进制字符串。原始 JSON 和对象字节可独立查看，媒体只是派生检查副本。全包数据及代码均保存在本项目 local/。</footer>
<script>
const tabs={sources:'源码',methods:'方法与调用',tables:'配置与中文',assets:'对象与媒体',payloads:'数据载体',status:'覆盖与限制'};let tab='sources',offset=0,selectedTable='',current=[];let revision=0;
const el=id=>document.getElementById(id);const api=async(route,args={})=>{const response=await fetch('/api/'+route+'?'+new URLSearchParams(args));if(!response.ok)throw Error('请求失败 '+response.status);return response.json()};
function showText(text){el('detail').replaceChildren();const pre=document.createElement('pre');pre.textContent=text;el('detail').append(pre)}
function pretty(value){return JSON.stringify(value,null,2)}
for(const [key,label] of Object.entries(tabs)){const b=document.createElement('button');b.textContent=label;b.dataset.tab=key;b.onclick=()=>{tab=key;offset=0;selectedTable='';el('detail').replaceChildren();load()};el('nav').append(b)}
async function detail(row){try{if(tab==='sources'){const [source]=await api('source',{id:row.id});showText(source.path+'\n\n'+source.text)}else if(tab==='methods'){const [method]=await api('method',{id:row.id});showText(pretty({...method,meta:JSON.parse(method.meta)}))}else if(tab==='tables'){selectedTable=row.name;offset=0;el('query').value='';const values=await api('rows',{table:selectedTable,q:el('query').value,offset});showText(pretty({table:row.name,schema:JSON.parse(row.meta),rows:values.map(v=>JSON.parse(v.text))}))}else if(tab==='assets'){const [asset]=await api('asset',{id:row.id});el('detail').replaceChildren();const media=JSON.parse(asset.media);for(const [index,file] of (media.files||[]).entries()){const url='/media?'+new URLSearchParams({id:row.id,index});if(file.path.endsWith('.png')){const image=document.createElement('img');image.src=url;image.alt=asset.name;el('detail').append(image)}else if(file.path.endsWith('.wav')){const audio=document.createElement('audio');audio.controls=true;audio.src=url;el('detail').append(audio)}const a=document.createElement('a');a.href=url;a.textContent=file.path;a.download=file.path.split('/').pop();el('detail').append(a,document.createElement('br'))}const b=document.createElement('button');b.textContent='查看原始类型树或对象字节';b.onclick=async()=>{const response=await fetch('/api/tree?'+new URLSearchParams({id:row.id}));showText(await response.text())};el('detail').append(b);const pre=document.createElement('pre');pre.textContent=asset.meta;el('detail').append(pre)}else if(tab==='payloads'){showText(pretty(JSON.parse(row.meta)));const a=document.createElement('a');a.href='/api/payload?'+new URLSearchParams({id:row.id});a.textContent='读取原始数据载体';a.target='_blank';el('detail').prepend(a)}}catch(error){showText(String(error))}}
async function load(){const token=++revision;for(const button of el('nav').children)button.classList.toggle('active',button.dataset.tab===tab);el('kind').style.display=tab==='assets'?'':'none';el('page').textContent='第 '+(offset/100+1)+' 页';try{if(tab==='tables'&&selectedTable){const values=await api('rows',{table:selectedTable,q:el('query').value,offset});if(token!==revision)return;showText(pretty({table:selectedTable,rows:values.map(v=>JSON.parse(v.text))}));return}const values=await api(tab,{q:el('query').value,type:el('kind').value,offset});if(token!==revision)return;el('items').replaceChildren();if(tab==='status'){showText(pretty(values));return}current=values;for(const row of values){const article=document.createElement('article');article.tabIndex=0;const label=document.createElement('div');label.textContent=tab==='sources'?row.path:tab==='methods'?row.type+'::'+row.name:row.name||row.id;const small=document.createElement('small');small.textContent=tab==='sources'?row.kind:tab==='methods'?row.assembly+' · '+row.kind+' · '+row.token:tab==='tables'?row.kind+' · '+row.row_count+' 条记录':tab==='assets'?row.type+' · '+row.source+' · '+row.path_id:row.kind;article.append(label,small);article.onclick=()=>detail(row);article.onkeydown=e=>{if(e.key==='Enter')detail(row)};el('items').append(article)}}catch(error){showText(String(error))}}
el('search').onclick=()=>{offset=0;if(tab!=='tables')selectedTable='';load()};el('query').onkeydown=e=>{if(e.key==='Enter'){offset=0;if(tab!=='tables')selectedTable='';load()}};el('kind').onchange=()=>{offset=0;load()};el('prev').onclick=()=>{offset=Math.max(0,offset-100);load()};el('next').onclick=()=>{offset+=100;load()};load();
</script></html>
